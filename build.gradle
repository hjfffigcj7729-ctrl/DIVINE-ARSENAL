plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}
group = 'com.divinearsenal'
version = '0.5.0'
base { archivesName = 'divine_arsenal' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
minecraft {
    mappings channel: 'official', version: '1.21.1'
    runs {
        client { workingDirectory project.file('run'); mods { divinearsenal { source sourceSets.main } } }
        server { workingDirectory project.file('run'); args '--nogui'; mods { divinearsenal { source sourceSets.main } } }
    }
}
repositories { maven { url = 'https://maven.minecraftforge.net' } }
dependencies { minecraft 'net.minecraftforge:forge:1.21.1-52.1.0' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
